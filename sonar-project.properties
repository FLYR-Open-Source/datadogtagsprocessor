# Required metadata
sonar.projectKey=FLYR-Open-Source_datadogtagsprocessor
sonar.organization=flyr-open-source
sonar.projectName=datadogtagsprocessor

# Path to the source code
sonar.sources=.

# Language (e.g., for a Python project)
sonar.language=go

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Additional settings (optional)
sonar.exclusions==**/*_test.go, bin/**

# List of files/folders to be excluded for CPD (Copy-Paste Detection)
sonar.cpd.exclusions=**/*_test.go, bin/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go