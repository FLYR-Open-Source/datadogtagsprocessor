name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.12.2
        args: "--timeout 5m -v"

  go-sec:
    name: GoSec
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: Run Gosec Security Scanner
      uses: securego/gosec@8d05295c5aed2220725cdfa56705df4106260d8a
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
    - name: Upload GoSec scan to GitHub Security
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
      with:
        sarif_file: gosec-results.sarif

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Trivy vulnerability scanner filesystem
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      with:
        scan-type: fs
        scan-ref: '.'
        hide-progress: false
        format: "sarif"
        output: "trivy-results-fs.sarif"
    - name: Upload Trivy scan to GitHub Security
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
      with:
        sarif_file: trivy-results-fs.sarif

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: Run Unit Tests
      run: |
        go run gotest.tools/gotestsum@latest --junitfile report.xml --jsonfile test-results.json -- -race -coverprofile=coverage.txt -covermode=atomic ./...
    - name: Convert Unit Tests
      continue-on-error: true
      run: |
        go run github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest -output ctrf-report.json < test-results.json
    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1
      with:
        report-path: ctrf-report.json
        group-by: suite
        summary-report: true
        failed-report: true
        flaky-report: true
        skipped-report: true
        suite-folded-report: true
        exit-on-fail: true
